<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامحتيني؟ ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding-top:100px;
    overflow:hidden;
    margin:0;

    /* الخلفية */
    background: url("Nody1.jpeg") no-repeat center center fixed;
    background-size: cover;
}

/* 🔥 طبقة تحسين احترافية للخلفية */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    /* مهم جدًا للصورة دي */
    background: rgba(0, 0, 0, 0.35);  /* تغميق عشان يوضح الكلام */
    

    z-index:0;
}

/* نخلي كل المحتوى فوق الطبقة */
h1, button, #message, #imgBox{
    position:relative;
    z-index:2;
}

h1{
    color:#ffffff;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
}

/* yes */
#yes{
    background:#4CAF50;
    color:white;
}

/* no */
#no{
    background:#ff4444;
    color:white;
    position:relative;
}

/* message */
#message{
    margin-top:30px;
    font-size:24px;
    color:white;
    display:none;
    text-shadow:0 2px 10px rgba(0,0,0,0.7);
}

/* الصورة */
#imgBox{
    display:none;
    margin-top:20px;
}

#imgBox img{
    width:250px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* قلوب */
.heart{
    position:fixed;
    top:-10px;
    color:#ff4d6d;
    font-size:20px;
    animation: fall linear forwards;
    z-index:1;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<h1>ممكن تسامحيني؟ ❤️</h1>

<button id="yes">❤️❤️ بحبك يا سمسوم</button>
<button id="no">🤬🤬🤬 لا انا زعلانه ومتنكده</button>

<div id="message">
   <div style="font-size:22px; line-height:1.8;">
❤️😂 مافيش بينا زعل يا نودي احنا اهل ❤️<br>
وده أحلى قرار خدتيه النهارده <br>
❤️❤️ أنا مستنيكي بفارغ الصبر عشان اخد بوسه و حضن كبيييير
</div>
</div>

<!-- الصورة -->
<div id="imgBox">
    <img src="Nody.jpeg">
</div>

<script>

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const message = document.getElementById("message");
const imgBox = document.getElementById("imgBox");

let heartsStarted = false;

yesBtn.onclick = () => {
    message.style.display = "block";
    imgBox.style.display = "block";

    if(!heartsStarted){
        heartsStarted = true;
        startHearts();
    }
};

noBtn.onmouseover = () => {
    noBtn.style.position = "absolute";
    noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
    noBtn.style.top = Math.random() * (window.innerHeight - 100) + "px";
};

function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = (2 + Math.random() * 3) + "s";
    heart.style.fontSize = (15 + Math.random() * 20) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}

function startHearts(){
    setInterval(createHeart, 300);
}

</script>

</body>
</html>
